<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Substitution &amp; Elimination Trainer</title>
<style>
:root{
  --bg:#f4f2ec; --card:#fffdf8; --ink:#1f2a37; --muted:#6b7280; --line:#e4e0d5; --soft:#f0ede4;
  --accent:#3a6ea5; --accent-soft:#e5edf7; --good:#2f855a; --good-soft:#e2f3e9; --bad:#c0392b; --bad-soft:#fbe6e2; --warn:#c27c0e;
  --shadow:0 1px 2px rgba(30,30,20,.04),0 6px 24px rgba(30,30,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161b; --card:#1b1f26; --ink:#e5e8ec; --muted:#9aa3ae; --line:#2b313a; --soft:#222730;
    --accent:#7aa7e0; --accent-soft:#1f2d40; --good:#5cc28a; --good-soft:#18301f; --bad:#ef7b6c; --bad-soft:#3a1f1c; --warn:#e3a33d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#13161b; --card:#1b1f26; --ink:#e5e8ec; --muted:#9aa3ae; --line:#2b313a; --soft:#222730;
  --accent:#7aa7e0; --accent-soft:#1f2d40; --good:#5cc28a; --good-soft:#18301f; --bad:#ef7b6c; --bad-soft:#3a1f1c; --warn:#e3a33d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:clamp(13px,1.7vh,16px);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:12px 16px}
.brand{font-weight:700;letter-spacing:.2px;font-size:1.05rem;white-space:nowrap}
.brand b{color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.78rem;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.spacer{flex:1}
.stats{display:flex;gap:14px;align-items:center;font-size:.9rem;color:var(--muted);white-space:nowrap}
.stats strong{color:var(--ink);font-variant-numeric:tabular-nums}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line)}
.timer.low{color:var(--warn)} .timer.crit{color:var(--bad)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--muted)}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
/* main */
main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;padding:0 16px 16px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);min-height:0;overflow:hidden;position:relative}
.stage{display:flex;flex-direction:column;padding:18px 20px}
.tbar{position:absolute;left:0;right:0;top:0;height:4px;background:transparent}
.tbar i{display:block;height:100%;width:100%;background:var(--accent);transition:width 1s linear,background .3s}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem}
.rxn{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vw,28px)}
.molbox{display:flex;align-items:center;justify-content:center;min-width:0;max-height:100%}
.molbox svg{max-width:100%;max-height:34vh;height:auto}
.arrow{display:flex;flex-direction:column;align-items:center;min-width:150px;max-width:230px;flex:0 1 210px}
.arrow .above,.arrow .below{font-size:1.05rem;text-align:center;line-height:1.3;min-height:1.3em}
.arrow .above{font-weight:600}
.arrow .below{color:var(--muted)}
.arrow svg{width:100%;height:16px;margin:4px 0}
.prodbox{min-width:90px;min-height:90px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.8rem;padding:6px}
.prodbox.filled{border-style:solid;border-color:var(--good);color:var(--ink)}
.prodbox svg{max-height:26vh;max-width:24vw;height:auto}
.subname{text-align:center;color:var(--muted);font-size:.92rem;margin-top:2px}
.hints{display:flex;flex-direction:column;gap:6px;margin-top:10px;min-height:0}
.hint{background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.9rem;line-height:1.35;animation:fade .25s ease}
.hint b{color:var(--accent)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
/* answer panel */
.panel{display:flex;flex-direction:column;padding:18px 20px;gap:12px}
.steph .k{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.steph h2{margin:2px 0 0;font-size:1.2rem;font-weight:650}
.steph p{margin:3px 0 0;color:var(--muted);font-size:.88rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:clamp(8px,1.3vh,13px) 14px;text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,transform .05s;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt .n{flex:none;width:22px;height:22px;border-radius:6px;background:var(--soft);color:var(--muted);font-size:.75rem;display:grid;place-items:center;font-weight:600}
.opt .t{font-weight:650;font-size:1.08rem}
.opt .d{display:block;font-size:.76rem;color:var(--muted);font-weight:400}
.opt.wide{grid-column:1/-1}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .n{background:var(--accent);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.miss{border-color:var(--good);border-style:dashed}
.opt.txt .t{font-weight:500;font-size:.93rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);max-height:52vh}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;position:relative;min-height:0;overflow:hidden}
.tile:hover:not(:disabled){border-color:var(--accent)}
.tile svg{max-width:100%;max-height:100%;height:auto;min-width:0}
.tile .plus{color:var(--muted);font-size:1.2rem}
.tile .n{position:absolute;top:6px;left:8px;font-size:.72rem;color:var(--muted);font-weight:600}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.actions{display:flex;gap:10px;align-items:center}
.primary{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer}
.primary:disabled{opacity:.45;cursor:default}
.secondary{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.secondary:disabled{opacity:.45;cursor:default}
.kbd{font-size:.72rem;color:var(--muted);margin-left:auto}
.fb{flex:1;min-height:0;overflow:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:8px}
.fb::-webkit-scrollbar{display:none}
.verdict{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.verdict .v{font-weight:700;font-size:1.05rem}
.verdict.good .v{color:var(--good)} .verdict.bad .v{color:var(--bad)}
.verdict .a{font-size:.95rem}
.verdict em{font-style:normal;color:var(--muted)}
.overall{font-size:.85rem;color:var(--muted)}
.why{margin:0;padding-left:18px;font-size:.9rem;line-height:1.4}
.why li{margin:2px 0}
.concl{border-left:3px solid var(--accent);padding:4px 10px;font-size:.9rem;background:var(--soft);border-radius:0 8px 8px 0;line-height:1.4}
.whynot{font-size:.86rem;line-height:1.4}
.whynot summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
.whynot summary::-webkit-details-marker{display:none}
.whynot ul{margin:4px 0 0;padding-left:18px}
/* overlay */
.overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.overlay[hidden]{display:none}
.menu{width:min(760px,100%);max-height:100%;padding:clamp(18px,3vh,30px) clamp(18px,3vw,34px);display:flex;flex-direction:column;gap:clamp(10px,2vh,18px)}
.menu h1{margin:0;font-size:clamp(1.4rem,3.2vh,1.9rem)}
.menu h1 b{color:var(--accent)}
.menu .lead{margin:4px 0 0;color:var(--muted)}
.field label{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left}
.seg button b{display:block;font-size:1rem}
.seg button span{display:block;font-size:.78rem;color:var(--muted);margin-top:2px;line-height:1.3}
.seg button.on{border-color:var(--accent);background:var(--accent-soft)}
.menu .foot{display:flex;align-items:center;gap:14px}
.menu .note{font-size:.8rem;color:var(--muted);line-height:1.4}
/* results */
.results{width:min(1100px,100%);height:min(720px,100%);display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:16px}
.rs{padding:22px;display:flex;flex-direction:column;gap:14px}
.big{display:flex;align-items:center;gap:18px}
.ring{width:110px;height:110px;flex:none}
.big h2{margin:0;font-size:1.4rem}
.big p{margin:4px 0 0;color:var(--muted)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:var(--soft);border-radius:12px;padding:8px 10px}
.trio b{display:block;font-size:1.2rem;font-variant-numeric:tabular-nums}
.trio span{font-size:.75rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:7px;min-height:0;overflow:hidden}
.bars h3,.rl h3{margin:0;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{display:grid;grid-template-columns:1fr 46px;gap:8px;align-items:center;font-size:.86rem}
.bar .track{grid-column:1/-1;height:6px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:-4px}
.bar .track i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.rl{padding:18px;display:flex;flex-direction:column;gap:8px;min-height:0}
.rows{display:flex;flex-direction:column;gap:6px;flex:1;min-height:0}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:0 10px;cursor:pointer;background:var(--card);text-align:left;flex:1;min-height:0;max-height:58px}
.row:hover{border-color:var(--accent)}
.row .i{font-weight:700;color:var(--muted);font-size:.85rem}
.row .q{font-size:.86rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .q small{color:var(--muted)}
.row .m{display:flex;gap:4px}
.dot{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:.7rem;font-weight:700}
.dot.y{background:var(--good-soft);color:var(--good)} .dot.x{background:var(--bad-soft);color:var(--bad)} .dot.na{background:var(--soft);color:var(--muted)}
.detail{display:flex;flex-direction:column;gap:8px;min-height:0;flex:1}
.detail .rxn{flex:0 1 auto;max-height:30%}
.detail .rxn svg{max-height:20vh}
.detail .fb{flex:1}
.legend{font-size:.75rem;color:var(--muted)}
@media (orientation:portrait),(max-width:820px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,.8fr) minmax(0,1.2fr)}
  .results{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100%}
  .bars{display:none}
  .molbox svg{max-height:24vh}
}
@media (max-width:600px){.chips{display:none}.seg{grid-auto-flow:row}}
svg.mol text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">S<sub>N</sub> <b>/</b> E Trainer</div>
    <div class="chips" id="chips"></div>
    <div class="spacer"></div>
    <div class="stats" id="stats"></div>
    <button class="ghost" id="btnMenu" title="Back to menu">New session</button>
  </header>
  <main>
    <section class="card stage">
      <div class="tbar" id="tbar"><i></i></div>
      <div class="qmeta"><span id="qnum"></span><span id="qtier"></span></div>
      <div class="rxn" id="rxn"></div>
      <div class="subname" id="subname"></div>
      <div class="hints" id="hints"></div>
    </section>
    <section class="card panel" id="panel"></section>
  </main>
</div>
<div class="overlay" id="overlay"></div>

<script>
'use strict';
/* =====================================================================
   1. MOLECULE DRAWING
   Atoms are placed by [label, parentIndex, angleDeg, bond] where bond is
   1, 2, 'w' (wedge, narrow end at parent) or 'd' (dash).
   ===================================================================== */
const RING  = [['C'],['C',0,30],['C',1,-30],['C',2,-90],['C',3,-150],['C',4,150]];
const BENZ  = [['C'],['C',0,30,2],['C',1,-30],['C',2,-90,2],['C',3,-150],['C',4,150,2]];
const CYENE = [['C'],['C',0,30,2],['C',1,-30],['C',2,-90],['C',3,-150],['C',4,150]];
const R6 = [0,1,2,3,4,5];

function build(spec){
  const atoms=[], bonds=[];
  spec.a.forEach(([el,p,ang,b=1])=>{
    let x=0,y=0;
    if(p!=null){
      const r=ang*Math.PI/180; x=atoms[p].x+Math.cos(r); y=atoms[p].y+Math.sin(r);
      bonds.push({a:p,b:atoms.length,o:b===2?2:1,s:(b==='w'||b==='d')?b:null});
    }
    atoms.push({el,x,y});
  });
  (spec.r||[]).forEach(([i,j,o=1])=>bonds.push({a:i,b:j,o,s:null}));
  return {atoms,bonds,ring:spec.ring||null};
}
const clone=m=>JSON.parse(JSON.stringify(m));

// label forms: [written to the right of the attachment, written to the left]
const LBL={'OH':['OH','HO'],'OTs':['OTs','TsO'],'OCH₃':['OCH₃','H₃CO'],'OEt':['OEt','EtO'],'CN':['CN','NC'],
  'N₃':['N₃','N₃'],'SCH₃':['SCH₃','H₃CS'],'SH':['SH','HS'],'CH₃':['CH₃','H₃C']};
const cw=ch=>/[₀-₉]/.test(ch)?.42:/[A-Z]/.test(ch)?.68:.52;
const tw=s=>[...s].reduce((w,c)=>w+cw(c),0);
const f1=n=>Math.round(n*10)/10;

function svgMol(m,o={}){
  const B=o.B||44, fs=Math.round(B*.42), A=m.atoms, vis=i=>!A[i].hide;
  const P=A.map(a=>({x:a.x*B,y:-a.y*B}));
  const nb=A.map(()=>[]);
  m.bonds.forEach(b=>{if(vis(b.a)&&vis(b.b)){nb[b.a].push(b.b);nb[b.b].push(b.a);}});
  const lab=A.map((a,i)=>{
    if(a.hide||a.el==='C') return null;
    let dx=0; nb[i].forEach(j=>dx+=P[j].x-P[i].x); dx/=(nb[i].length||1);
    const pair=LBL[a.el], w=t=>tw(t)*fs;
    if(!pair) return {t:a.el,anchor:'middle',x:P[i].x,x0:P[i].x-w(a.el)/2,w:w(a.el)};
    if(dx>B*.3){const t=pair[1],x=P[i].x+cw([...t].pop())*fs/2;return {t,anchor:'end',x,x0:x-w(t),w:w(t)};}
    const t=pair[0],x=P[i].x-cw(t[0])*fs/2; return {t,anchor:'start',x,x0:x,w:w(t)};
  });
  const shrink=(i,j)=>lab[i]?fs*(.42+.28*Math.abs(P[j].y-P[i].y)/B):0;
  let lines='',fills='';
  const L=(x1,y1,x2,y2,cls)=>{lines+=`<line x1="${f1(x1)}" y1="${f1(y1)}" x2="${f1(x2)}" y2="${f1(y2)}"${cls?` class="${cls}"`:''}/>`;};
  let cen=null;
  if(m.ring){cen={x:0,y:0};m.ring.forEach(i=>{cen.x+=P[i].x/m.ring.length;cen.y+=P[i].y/m.ring.length;});}
  m.bonds.forEach(b=>{
    if(!vis(b.a)||!vis(b.b))return;
    const dx=P[b.b].x-P[b.a].x, dy=P[b.b].y-P[b.a].y, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len, nx=-uy, ny=ux;
    const s1=shrink(b.a,b.b), s2=shrink(b.b,b.a);
    const x1=P[b.a].x+ux*s1, y1=P[b.a].y+uy*s1, x2=P[b.b].x-ux*s2, y2=P[b.b].y-uy*s2;
    if(b.s==='w'){
      const h=B*.12;
      fills+=`<polygon points="${f1(x1)},${f1(y1)} ${f1(x2+nx*h)},${f1(y2+ny*h)} ${f1(x2-nx*h)},${f1(y2-ny*h)}"/>`;
    }else if(b.s==='d'){
      const n=7,h=B*.12;
      for(let k=1;k<=n;k++){const t=k/n,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t,hw=Math.max(h*t,1.2);L(cx+nx*hw,cy+ny*hw,cx-nx*hw,cy-ny*hw,'th');}
    }else if(b.o===2){
      const g=B*.17; let side=0;
      const mx=(P[b.a].x+P[b.b].x)/2, my=(P[b.a].y+P[b.b].y)/2;
      if(cen&&m.ring.includes(b.a)&&m.ring.includes(b.b)) side=Math.sign((cen.x-mx)*nx+(cen.y-my)*ny);
      else{
        let d=0;[b.a,b.b].forEach(i=>nb[i].forEach(j=>{if(j!==b.a&&j!==b.b)d+=(P[j].x-P[i].x)*nx+(P[j].y-P[i].y)*ny;}));
        side=Math.abs(d)<B*.05?0:Math.sign(d);
        // terminal =CH2 on a branched carbon: centre the double bond
        const oa=nb[b.a].length-1, ob=nb[b.b].length-1;
        if(Math.min(oa,ob)===0&&Math.max(oa,ob)>=2)side=0;
      }
      if(side===0){L(x1+nx*g/2,y1+ny*g/2,x2+nx*g/2,y2+ny*g/2);L(x1-nx*g/2,y1-ny*g/2,x2-nx*g/2,y2-ny*g/2);}
      else{
        L(x1,y1,x2,y2);
        const sh=len*.13, ox=nx*g*side, oy=ny*g*side;
        L(x1+ux*sh+ox,y1+uy*sh+oy,x2-ux*sh+ox,y2-uy*sh+oy);
      }
    }else L(x1,y1,x2,y2);
  });
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  const ext=(a,b,c,d)=>{minx=Math.min(minx,a);maxx=Math.max(maxx,b);miny=Math.min(miny,c);maxy=Math.max(maxy,d);};
  let texts='';
  A.forEach((a,i)=>{
    if(a.hide)return;
    const l=lab[i];
    if(!l){ext(P[i].x-4,P[i].x+4,P[i].y-4,P[i].y+4);return;}
    ext(l.x0,l.x0+l.w,P[i].y-fs*.62,P[i].y+fs*.62);
    texts+=`<text x="${f1(l.x)}" y="${f1(P[i].y+fs*.36)}" text-anchor="${l.anchor}" font-size="${fs}">${l.t}</text>`;
  });
  const pad=6, W=maxx-minx+pad*2, H=maxy-miny+pad*2;
  return `<svg class="mol" xmlns="http://www.w3.org/2000/svg" viewBox="${f1(minx-pad)} ${f1(miny-pad)} ${f1(W)} ${f1(H)}" width="${f1(W)}" height="${f1(H)}" role="img">`+
    `<g stroke="currentColor" stroke-width="${f1(B*.045)}" stroke-linecap="round" fill="none">${lines.replace(/ class="th"/g,` stroke-width="${f1(B*.035)}"`)}</g>`+
    `<g fill="currentColor">${fills}${texts}</g></svg>`;
}

/* =====================================================================
   2. SUBSTRATES   L = leaving-group atom, A = alpha carbon
   z / h = beta carbon giving the Zaitsev / Hofmann alkene (only when distinct)
   g = a gamma carbon for a "wrong position" alkene distractor

/* =====================================================================
   4. RULE ENGINE (traditional textbook rules; ambiguous combinations return null
   and are never asked)
   ===================================================================== */
const ORDER=['SN1','SN2','E1','E2'];
function evaluate(s,r,heat){
  if(r.degs&&!(r.degs.includes(s.deg)||(lgType(s.lg)==='OH'&&r.degs.includes('OHsub'))))return null;
  const c=r.cat,d=s.deg,lt=lgType(s.lg);
  const C=(set,major,key,tier,extra)=>Object.assign({set,major:major||set[0],key,tier},extra||{});
  let R=null;
  if(lt==='good'){
    if((r.id==='NaBr'&&s.lg==='Br')||(r.id==='NaI'&&s.lg==='I'))return null;
    if(c==='hx'||c==='dehyd')return null;
    if(d==='sp2'){ if(!heat&&(c==='snwb'||c==='weak'))R=C(['NR'],0,'sp2',3); }
    else if(d==='Me'){
      if(heat)return null;
      if(c==='snwb')R=C(['SN2'],0,'me',1);
      else if(c==='snsb')R=C(['SN2'],0,'meStrong',2);
      else if(c==='weak')R=C(['NR'],0,'weakNoIon',2);
    }else if(d==='1'){
      if(c==='snwb'&&!heat)R=C(['SN2'],0,'p_snwb',1);
      else if(c==='snsb'&&!heat)R=C(['SN2','E2'],'SN2','p_snsb',2);
      else if(c==='bulky')R=C(['E2'],0,'bulky',1);
      else if(c==='weak'&&!heat)R=C(['NR'],0,'weakNoIon',2);
    }else if(d==='2'){
      if(c==='snwb'&&!heat)R=C(['SN2'],0,'s_snwb',2);
      else if(c==='snsb')R=C(['SN2','E2'],'E2','s_snsb',2);
      else if(c==='bulky')R=C(['E2'],0,'bulky',1);
      else if(c==='weak'&&heat)R=C(['SN1','E1'],'E1','s_weak',2);
    }else if(d==='3'){
      if(c==='snsb')R=C(['E2'],0,'t_strong',1);
      else if(c==='bulky')R=C(['E2'],0,'bulky',1);
      else if(c==='weak')R=heat?C(['SN1','E1'],'E1','t_weakHeat',1):C(['SN1','E1'],'SN1','t_weakRT',1);
    }
    if(R&&s.lg==='OTs')R.tier=Math.max(R.tier,2);
  }else if(lt==='F'){
    if(!heat&&(c==='snwb'||c==='weak'))R=C(['NR'],0,'F',3);
  }else{ // alcohols
    if((c==='snwb'||c==='snsb')&&!heat)R=C(['NR'],0,'OH',3);
    else if(c==='hx'&&!heat){ if(d==='1')R=C(['SN2'],0,'hx1',2,{noElim:1}); else if(d==='3')R=C(['SN1'],0,'hx3',2,{noElim:1}); }
    else if(c==='dehyd'&&heat&&(d==='2'||d==='3'))R=C(['E1'],0,'dehyd',2);
  }
  return R;
}
// what the student is asked depends on the topic toggle
function project(R,topic){
  if(topic==='both')return {set:R.set.slice(),major:R.major};
  const keep=topic==='sub'?['SN1','SN2']:['E1','E2'];
  const set=R.set.filter(m=>keep.includes(m));
  if(!set.length)return {set:['NR'],major:'NR'};
  return {set,major:set.length>1?R.major:set[0]};
}

    dehyd:`${r.nm}: its conjugate base is a very poor nucleophile.`}[c]);
  if(APROTIC.includes(q.solv)&&lt==='good'&&d!=='sp2')B.push(`${q.solv} is polar aprotic: the nucleophile stays unsolvated and reactive, which favors ${SN2}.`);
  if(c==='weak'||c==='dehyd'){
    if(q.heat&&lt==='good'||c==='dehyd')B.push('Heat favors elimination over substitution.');
    else if(d==='3'&&lt==='good')B.push(`No heat (25 °C): substitution (${SN1}) is the major pathway.`);
  }else if(q.heat&&q.R.set.includes('E2'))B.push('Heat further favors elimination.');
  return B;
}
function whyNot(m,q){
  const s=q.s,r=q.r,c=r.cat,d=s.deg,lt=lgType(s.lg);
  if(m==='NR')return {both:'A reaction does occur',sub:'Substitution does occur',elim:'Elimination does occur'}[q.topic]+': there is a usable leaving group and a suitable reagent.';
  if(lt==='F')return 'Fluoride is too poor a leaving group for any pathway.';
  if(lt==='OH'&&c!=='hx'&&c!=='dehyd')return '–OH is a poor leaving group unless acid protonates it.';
  if(d==='sp2')return m==='SN2'?'Backside attack on an sp² carbon is blocked.':m==='E2'?`${r.nm} is not a strong enough base, and vinyl/aryl halides are not standard E2 substrates under these conditions.`:'Vinyl/aryl cations are far too unstable to form.';
  if(m==='SN2'){
    if(d==='3')return 'A 3° carbon is too hindered for backside attack.';
    if(c==='weak')return `${r.nm} is too weak a nucleophile for ${SN2}.`;
    if(c==='bulky')return 'tert-Butoxide is too bulky to reach the carbon; it acts as a base.';
    if(c==='dehyd')return 'HSO₄⁻ / H₂PO₄⁻ are very poor nucleophiles.';
    return `${SN2} is not favored here.`;
  }
  if(m==='SN1'||m==='E1'){
    if(m==='E1'&&d==='Me')return 'There are no β-hydrogens to remove.';
    if(d==='Me'||d==='1')return 'Methyl and 1° carbocations are too unstable to form.';
    if(c==='snwb')return `A strong nucleophile reacts in a second-order step (${SN2}) before any carbocation forms.`;
    if(c==='snsb'||c==='bulky')return 'With a strong base present, the second-order pathway (E2) is faster than ionization.';
    if(m==='E1'&&c==='hx')return `Br⁻ is a good nucleophile and there is no heat, so the carbocation is trapped (${SN1}).`;
    if(m==='SN1'&&c==='dehyd')return 'There is no good nucleophile, and heat drives elimination.';
    return `${mh(m)} is not favored here.`;
  }
  if(m==='E2'){
    if(d==='Me')return 'There are no β-hydrogens, so elimination is impossible.';
    if(c==='weak')return `E2 needs a strong base; ${r.nm.toLowerCase()} is a weak base.`;
    if(c==='snwb')return `${r.nm} is a weak base, so it substitutes rather than eliminates.`;
    if(c==='hx')return 'Br⁻ is a very weak base; substitution occurs.';
    if(c==='dehyd')return 'There is no strong base; the protonated alcohol ionizes first → E1.';
    return 'E2 is not favored here.';
  }
}
function alsoWhy(m,q){
  if(m==='SN1'||m==='E1')return `The carbocation can be trapped by the solvent (${SN1}) or lose a β-hydrogen (E1), so both always occur together.`;
  if(m==='E2')return `${q.r.nm} is also a strong base, so some E2 competes.`;
  if(m==='SN2')return `${q.r.nm} is also a strong nucleophile, so some ${SN2} competes.`;
  return '';
}
function hints(q){
  return [
    'Start with the substrate: is the carbon holding the leaving group methyl, 1°, 2°, 3°, or sp²? Is the leaving group a good one?',
    `Classify <b>${q.r.f}</b>: strong or weak nucleophile? Strong or weak base? Bulky?`,
    {snwb:'A strong nucleophile that is a weak base usually means second-order substitution, if the carbon is accessible.',
     snsb:`Strong base / strong nucleophile → think second-order (${SN2} / E2). The substrate decides which wins.`,
     bulky:'Bulky bases have trouble reaching a carbon atom. What can they reach?',
     weak:`Weak nucleophile/base → think first-order (${SN1} / E1), but only if a stable carbocation can form. Check the temperature.`,
     hx:'What does strong acid do to an –OH group? Then ask whether a stable carbocation can form.',
     dehyd:'Strong acid + heat with an alcohol: what does the –OH become, and is there any good nucleophile around?'}[q.r.cat]
  ];
}

/* =====================================================================
   6. PRODUCT QUESTIONS (stereochemistry, Zaitsev / Hofmann)
   ===================================================================== */
function subst(s,nu,flip){
  const m=clone(s.mol); m.atoms[s.L].el=nu;
  if(flip)m.bonds.forEach(b=>{if(b.a===s.A&&b.s)b.s=b.s==='w'?'d':'w';});
  return m;
}
function alkene(s,beta,gamma){
  const m=clone(s.mol); m.atoms[s.L].hide=true;
  m.bonds.forEach(b=>{if(b.a===s.A)b.s=null;});
  const x=gamma==null?[s.A,beta]:[beta,gamma];
  const bd=m.bonds.find(b=>(b.a===x[0]&&b.b===x[1])||(b.a===x[1]&&b.b===x[0])); bd.o=2;
  return m;
}
function makeProduct(q){
  const s=q.s,r=q.r,target=q.proj.set.length>1?q.proj.major:q.proj.set[0];
  if(target==='NR')return null;
  let opts,correct,kind;
  if(target==='SN1'||target==='SN2'){
    if(!s.stereo||!r.nu)return null;
    const inv=subst(s,r.nu,true),ret=subst(s,r.nu,false);
    opts=[{id:'inv',mols:[inv]},{id:'ret',mols:[ret]},{id:'rac',mols:[inv,ret]}];
    const b=s.z!=null?s.z:s.beta; if(b!=null)opts.push({id:'alk',mols:[alkene(s,b)]});
    correct=target==='SN2'?'inv':'rac'; kind='stereo';
  }else{
    if(s.z==null)return null;
    const bulky=r.cat==='bulky'; if(bulky&&!s.hof)return null;
    opts=[{id:'zai',mols:[alkene(s,s.z)]},{id:'hof',mols:[alkene(s,s.h)]}];
    if(s.g!=null)opts.push({id:'bg',mols:[alkene(s,s.z,s.g)]});
    if(r.nu)opts.push({id:'sub',mols:[subst(s,r.nu,!!s.stereo)]});
    correct=bulky?'hof':'zai'; kind='regio';
  }
  shuffle(opts);
  const ex={inv:`${SN2} is a one-step backside attack → inversion of configuration (the wedge becomes a dash, or vice versa).`,
    rac:`${SN1} goes through a flat sp² carbocation that can be attacked from either face → racemization (both enantiomers).`,
    zai:'A small base (or E1) gives the more substituted, more stable alkene: the Zaitsev product.',
    hof:'The bulky base removes the most accessible (least hindered) β-hydrogen → the less substituted Hofmann product.'}[correct];
  const hint=kind==='stereo'?'Does this pathway involve a backside attack or a flat carbocation?':(r.cat==='bulky'?'Is the base bulky? Which β-hydrogens can it reach most easily?':'Which possible alkene is more substituted (and more stable)?');
  const prompt=kind==='stereo'?'What is the substitution product?':'What is the major alkene product?';
  return {opts,correct,kind,ex,hint,prompt};
}

const store={get(k,d){try{const v=localStorage.getItem('sne_'+k);return v?JSON.parse(v):d;}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('sne_'+k,JSON.stringify(v));}catch(e){}}};
const rand=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

let SET=Object.assign({mode:'practice',topic:'both',tier:2},store.get('settings',{}));

const TIERS={1:'Intro',2:'Standard',3:'Exam'};
const TOPICS={sub:'Substitution',elim:'Elimination',both:'Sub + Elim'};

function buildBank(st){
  const bank=[];
  for(const s of SUBS)for(const r of RG)for(const heat of [false,true])for(const solv of r.solv){
    const R=evaluate(s,r,heat); if(!R||R.tier>st.tier)continue;
    if(st.topic==='elim'&&R.noElim)continue;
    bank.push({s,r,heat,solv,R,key:[s.id,r.id,heat?1:0,solv].join('|'),proj:project(R,st.topic)});
  }
  return bank;
}
function prepare(){
  BANK=buildBank(SET); GROUPS={};
  BANK.forEach(b=>{const k=b.proj.set.join('+')+'|'+b.proj.major;(GROUPS[k]=GROUPS[k]||[]).push(b);});
}
function pickItem(){
  const keys=Object.keys(GROUPS), recent=store.get('recent',[]);
  for(let t=0;t<60;t++){
    const g=GROUPS[keys[rand(keys.length)]];
    let pool=g.filter(b=>!sess.used.has(b.key)&&b.s.id!==sess.lastSub&&b.proj.set.join()+b.proj.major!==sess.lastAns);
    if(!pool.length)continue;
    if(t<40){const ns=pool.filter(b=>!sess.subs.has(b.s.id));if(ns.length)pool=ns;else continue;}
    const fresh=pool.filter(b=>!recent.includes(b.key)); if(fresh.length)pool=fresh;
    if(SET.tier===3){const hard=pool.filter(b=>b.R.tier===3);if(hard.length&&Math.random()<.35)pool=hard;}
    return pool[rand(pool.length)];
  }
  return BANK[rand(BANK.length)];
}
function newQuestion(){
  const b=pickItem();
  sess.used.add(b.key); sess.subs.add(b.s.id); if(sess.subs.size>24)sess.subs.clear(); sess.lastSub=b.s.id; sess.lastAns=b.proj.set.join()+b.proj.major;
  const recent=store.get('recent',[]); recent.push(b.key); store.set('recent',recent.slice(-120));
  const q=Object.assign({},b,{topic:SET.topic});
  const p=SET.tier===1?0:SET.tier===2?.45:.6;
  if(Math.random()<p)q.prod=makeProduct(q);
  if(SET.mode==='quiz'){
    // distractors: reasoning that is true for a *different* reaction, plus one common misconception
    const kk=q.R.key, k=KEYS[kk], near=new Set([kk]);
    EXCL.forEach(g=>{if(g.includes(kk))g.forEach(x=>near.add(x));});
    const others=shuffle(Object.keys(KEYS).filter(x=>!near.has(x)));
    others.sort((a,b)=>KEYS[b].top.filter(t=>k.top.includes(t)).length-KEYS[a].top.filter(t=>k.top.includes(t)).length);
    const pool=others.slice(0,5), wrong=shuffle(pool).slice(0,2).map(x=>KEYS[x].t);
    const rel=MYTHS.filter(x=>k.top.includes(x[1]));
    wrong.push((rel.length?rel:MYTHS)[rand((rel.length?rel:MYTHS).length)][0]);
    q.follow=shuffle([{t:k.t,ok:true},...wrong.map(t=>({t,ok:false}))]);
  }
  q.rec={sel:[],mechOk:false,majorOk:null,prodOk:null,followOk:null,timeout:false,time:0,hintsUsed:0};
  return q;
}

/* ---------- timer ---------- */
function startTimer(){
  stopTimer(); Q.left=QUIZ_SECS; Q.t0=Date.now();
  const bar=$('#tbar i'); bar.style.transition='none'; bar.style.width='100%'; bar.style.background='var(--accent)';
  requestAnimationFrame(()=>{bar.style.transition='';});
  timerId=setInterval(()=>{
    Q.left--; const el=$('#timer');
    if(el){el.textContent=Q.left+'s';el.className='timer'+(Q.left<=5?' crit':Q.left<=15?' low':'');}
    bar.style.width=(Q.left/QUIZ_SECS*100)+'%';
    bar.style.background=Q.left<=5?'var(--bad)':Q.left<=15?'var(--warn)':'var(--accent)';
    if(Q.left<=0){stopTimer(); if(Q.step==='mech')submitMech(true); else if(Q.step==='major')pickMajor(null,true);}
  },1000);
}
function stopTimer(){
  if(timerId){clearInterval(timerId);timerId=null;if(Q&&Q.t0)Q.rec.time=Math.min(QUIZ_SECS,Math.round((Date.now()-Q.t0)/1000));}
}

/* =====================================================================
   9. MENU & RESULTS
   ===================================================================== */
const ov=$('#overlay');
function segHTML(name,items){
  return `<div class="seg" data-f="${name}">${items.map(([v,b,s])=>`<button data-v="${v}" class="${String(SET[name])===String(v)?'on':''}"><b>${b}</b><span>${s}</span></button>`).join('')}</div>`;
}
function showMenu(){
  stopTimer(); sess=null; renderHeader();
  const n=buildBank(SET).length;
  ov.innerHTML=`<div class="card menu">
    <div><h1>S<sub>N</sub>1 · S<sub>N</sub>2 · E1 · E2 <b>Trainer</b></h1><p class="lead">Look at the substrate and conditions, then decide which pathway(s) occur.</p></div>
    <div class="field"><label>Mode</label>${segHTML('mode',[['practice','Practice','Untimed, with hints and an explanation after every answer'],['quiz','Quiz',`${QUIZ_LEN} questions, ${QUIZ_SECS} s each, no hints, plus a “how did you know?” follow-up`]])}</div>
    <div class="field"><label>Reactions tested</label>${segHTML('topic',[['sub','Substitution','S<sub>N</sub>1 vs S<sub>N</sub>2'],['elim','Elimination','E1 vs E2'],['both','Both','All four pathways']])}</div>
    <div class="field"><label>Difficulty</label>${segHTML('tier',[[1,'Intro','Clear-cut cases: methyl/1° S<sub>N</sub>2, bulky bases, 3° substrates'],[2,'Standard','Adds 2° substrates, tosylates, alcohols, stereochemistry, Zaitsev/Hofmann'],[3,'Exam','Adds no-reaction traps: vinyl/aryl, fluorides, –OH without acid']])}</div>
    <div class="foot"><button class="primary" id="start">Start ${SET.mode==='quiz'?'quiz':'practicing'} →</button><span class="note"><b>${n}</b> distinct questions in this set.<br>Scope: methyl, 1°, 2°, 3° and sp² carbons; no allylic/benzylic substrates, rearrangements or neopentyl.</span></div>
  </div>`;
  ov.hidden=false;
  ov.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const f=seg.dataset.f; SET[f]=f==='tier'?+b.dataset.v:b.dataset.v; store.set('settings',SET); showMenu();
  }));
  $('#start').onclick=start; $('#start').focus({preventScroll:true});
}
function start(){
  prepare();
  sess={mode:SET.mode,idx:0,n:0,right:0,streak:0,points:0,used:new Set(),subs:new Set(),hist:[],lastSub:null,lastAns:null};
  ov.hidden=true; showQuestion();
}
function ringSVG(p){
  const r=46,c=2*Math.PI*r;
  return `<svg class="ring" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--soft)" stroke-width="10"/>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f1(c*p)} ${f1(c)}" transform="rotate(-90 55 55)"/>
    <text x="55" y="62" text-anchor="middle" font-size="22" font-weight="700" fill="currentColor">${Math.round(p*100)}%</text></svg>`;
}
function showResults(){
  const H=sess.hist, mech=H.filter(q=>q.rec.mechOk).length, prods=H.filter(q=>q.prod), pr=prods.filter(q=>q.rec.prodOk).length,
    fol=H.filter(q=>q.rec.followOk).length, total=H.length*2+prods.length, pts=mech+pr+fol,
    avg=Math.round(H.reduce((a,q)=>a+q.rec.time,0)/H.length);
  const cat={};
  const add=(c,ok)=>{cat[c]=cat[c]||[0,0];cat[c][1]++;if(ok)cat[c][0]++;};
  H.forEach(q=>{add(KEYS[q.R.key].c,q.rec.mechOk); if(q.prod)add(q.prod.kind==='stereo'?'Stereochemistry':'Zaitsev / Hofmann',q.rec.prodOk);});
  const msg=pts/total>=.9?'Excellent work!':pts/total>=.7?'Solid — review the misses.':pts/total>=.5?'Getting there.':'Keep practicing.';
  const dot=v=>v==null?'<span class="dot na">–</span>':v?'<span class="dot y">✓</span>':'<span class="dot x">✗</span>';
  ov.innerHTML=`<div class="results">
    <div class="card rs">
      <div class="big">${ringSVG(pts/total)}<div><h2>${msg}</h2><p>${pts} of ${total} points · avg ${avg}s per question</p></div></div>
      <div class="trio"><div><b>${mech}/${H.length}</b><span>Mechanisms</span></div><div><b>${prods.length?pr+'/'+prods.length:'–'}</b><span>Products</span></div><div><b>${fol}/${H.length}</b><span>Reasoning</span></div></div>
      <div class="bars"><h3>By concept</h3>${Object.entries(cat).map(([k,[a,b]])=>`<div class="bar"><span>${k}</span><span class="c">${a}/${b}</span><div class="track"><i style="width:${a/b*100}%"></i></div></div>`).join('')}</div>
      <div class="actions" style="margin-top:auto"><button class="primary" id="again">Try another quiz</button><button class="secondary" id="menu2">Menu</button></div>
    </div>
    <div class="card rl" id="rl"></div>
  </div>`;
  const list=()=>{
    $('#rl').innerHTML=`<h3>Review · tap a question to see the explanation</h3><div class="rows">${H.map((q,i)=>`<button class="row" data-i="${i}"><span class="i">${i+1}</span><span class="q">${q.s.name} + ${q.r.f} <small>→ ${answerText(q.proj,q.topic).replace(/<em>|<\/em>/g,'')}</small></span><span class="m">${dot(q.rec.mechOk)}${dot(q.prod?q.rec.prodOk:null)}${dot(q.rec.followOk)}</span></button>`).join('')}</div>
      <div class="legend">Columns: mechanism · product · reasoning</div>`;
    $('#rl').querySelectorAll('.row').forEach(b=>b.onclick=()=>detail(+b.dataset.i));
  };
  const detail=i=>{
    const q=H[i];
    let ph='';
    if(q.prod){const c=q.prod.opts.find(o=>o.id===q.prod.correct);ph=`<div class="concl"><b>Product:</b> ${q.prod.ex}</div>`;}
    $('#rl').innerHTML=`<div class="actions"><button class="secondary" id="back">← All questions</button><span class="kbd">Question ${i+1}</span></div>
      <div class="detail"><div class="rxn">${rxnHTML(q,34).replace('class="prodbox" id="prodbox">?','class="prodbox'+(q.prod?' filled':'')+'">'+(q.prod?q.prod.opts.find(o=>o.id===q.prod.correct).mols.map(m=>svgMol(m,{B:26})).join(' + '):'?'))}</div>
      <div class="fb">${explainHTML(q,true)}${ph}</div></div>`;
    $('#back').onclick=list;
  };
  list();
  ov.hidden=false;
  $('#again').onclick=start; $('#menu2').onclick=showMenu;
}

/* =====================================================================
   10. KEYBOARD & BOOT
   ===================================================================== */
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(!ov.hidden){ if(e.key==='Enter'&&$('#start')){e.preventDefault();start();} return; }
  if(!Q)return;
  const n=parseInt(e.key,10);
  if(e.key==='Enter'){
    e.preventDefault();
    if(Q.step==='mech'&&Q.sel.size)submitMech();
    else{const nx=$('#nx');if(nx)nx.click();}
    return;
  }
  if((e.key==='h'||e.key==='H')&&$('#hintBtn')&&!$('#hintBtn').disabled){showHint();return;}
  if(!n)return;
  if(Q.step==='mech'){const m=mechOptions()[n-1];if(m)toggle(m);}
  else if(Q.step==='major'){const m=Q.proj.set[n-1];if(m)pickMajor(m);}
  else if(Q.step==='product'){const o=Q.prod.opts[n-1];if(o)pickProduct(o.id);}
  else if(Q.step==='follow'){if(n<=Q.follow.length)pickFollow(n-1);}
});
$('#btnMenu').onclick=showMenu;
showMenu();
</script>
